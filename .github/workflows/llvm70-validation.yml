name: LLVM70 load validation
on:
  workflow_dispatch:
    inputs:
      patch_sha:
        description: Exact candidate source commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PATCH_SHA: ${{ inputs.patch_sha }}
      LIT_USE_INTERNAL_SHELL: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.patch_sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.ref }}
          path: validation
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify source and prepare tools
        run: |
          set -euo pipefail
          [[ "$PATCH_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$PATCH_SHA"
          sudo apt-get update
          sudo apt-get install -y llvm-18-tools ninja-build
          python -m pip install lit==23.1.3 nvidia-cuda-nvcc-cu12==12.9.86 nvidia-cuda-nvrtc-cu12==12.9.86 pre-commit 'pytest>=8,<9' filecheck ml-dtypes cffi
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          repository: NVIDIA/numba-cuda-mlir
          run-id: 37946828566
          artifact-ids: 11624341691
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/modern
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          repository: NVIDIA/numba-cuda-mlir
          run-id: 37946828566
          artifact-ids: 11624920409
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/llvm7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          repository: NVIDIA/numba-cuda-mlir
          run-id: 37946828566
          artifact-ids: 11624362575
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/wheel
      - name: Configure dependencies
        run: |
          set -euo pipefail
          sha256sum "$RUNNER_TEMP"/wheel/*.whl
          python -m pip install --only-binary=:all: "$RUNNER_TEMP"/wheel/*.whl 'cuda-toolkit[cudart]==13.4.2'
          find "$RUNNER_TEMP/modern/bin" -type f -exec chmod +x {} +
          for tool in FileCheck count not; do
            test -x "/usr/lib/llvm-18/bin/$tool"
            ln -sf "/usr/lib/llvm-18/bin/$tool" "$RUNNER_TEMP/modern/bin/$tool"
          done
          test -x "$RUNNER_TEMP/modern/bin/mlir-tblgen"
          libllvm7="$RUNNER_TEMP/llvm7/lib/libLLVM-7.so"
          test -f "$libllvm7"
          echo "LIBLLVM7=$libllvm7" >> "$GITHUB_ENV"
          nvvm=$(python -c 'import site; from pathlib import Path; print(next(p for r in site.getsitepackages() if (p := Path(r)/"nvidia/cuda_nvcc/nvvm/lib64/libnvvm.so").is_file()))')
          echo "LLVM70_LIBNVVM=$nvvm" >> "$GITHUB_ENV"
          pythoncapi=$(python -c 'import numba_cuda_mlir; from pathlib import Path; print(Path(numba_cuda_mlir.__file__).parent/"_mlir/_mlir_libs/libMLIRPythonCAPI.so")')
          test -f "$pythoncapi"
          echo "LLVM70_PYTHON_CAPI=$pythoncapi" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/modern/lib:$RUNNER_TEMP/llvm7/lib:$(dirname "$nvvm"):$(dirname "$pythoncapi")" >> "$GITHUB_ENV"
          command -v FileCheck
          lit --version
          sha256sum "$libllvm7" "$nvvm" "$pythoncapi"
      - name: Verify CPU translation dependencies
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from numba_cuda_mlir.mlir_optimization import _get_libnvvm_path, _get_nvvm_ir_version
          from numba_cuda_mlir.numba_cuda.cudadrv.libs import get_libdevice
          nvvm = Path(_get_libnvvm_path().decode()).resolve()
          assert nvvm == Path(os.environ["LLVM70_LIBNVVM"]).resolve(), nvvm
          libdevice = Path(get_libdevice())
          assert libdevice.is_file(), libdevice
          print("Resolved NVVM:", nvvm)
          print("Resolved libdevice:", libdevice)
          print("NVVM IR/debug version:", _get_nvvm_ir_version())
          PY
      - name: Prove regression on old owner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results"
          mkdir -p "$RUNNER_TEMP/mlir-tests"
          cp tests/mlir/test_*.py "$RUNNER_TEMP/mlir-tests/"
          sha256sum "$RUNNER_TEMP/mlir-tests/test_llvm70_translation.py"
          cp cext/mlir-llvm70/lib/LLVM70Target.cpp "$RUNNER_TEMP/patched-owner.cpp"
          gh api repos/NVIDIA/numba-cuda-mlir/contents/cext/mlir-llvm70/lib/LLVM70Target.cpp?ref=d11fbd636362e1a72f76438a76fdce6ba803f032 \
            --jq .content | base64 -d > cext/mlir-llvm70/lib/LLVM70Target.cpp
          sha256sum cext/mlir-llvm70/lib/LLVM70Target.cpp
          cmake -S cext/mlir-llvm70 -B "$RUNNER_TEMP/build" -G Ninja \
            -DMLIR_DIR="$RUNNER_TEMP/modern/lib/cmake/mlir" \
            -DLLVM_DIR="$RUNNER_TEMP/modern/lib/cmake/llvm" \
            -DLLVM70_MLIR_PYTHON_CAPI="$LLVM70_PYTHON_CAPI" \
            -DLLVM_EXTERNAL_LIT="$(command -v lit)" \
            -DCMAKE_CXX_STANDARD=17 -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/build" --target MLIRToLLVM70 llvm70-translate --parallel 2
          python validation/validation/llvm70-native-check.py \
            "$RUNNER_TEMP/build/lib/libMLIRToLLVM70.so" validation/validation/load-volatile.mlir \
            "$RUNNER_TEMP/results/baseline" --baseline
          if FileCheck validation/validation/load-volatile.mlir < "$RUNNER_TEMP/results/baseline.ll" \
              2> "$RUNNER_TEMP/results/baseline-check.txt"; then
            exit 1
          fi
          grep -q 'expected string not found' "$RUNNER_TEMP/results/baseline-check.txt"
          cat "$RUNNER_TEMP/results/baseline-check.txt"
          cp "$RUNNER_TEMP/build/lib/libMLIRToLLVM70.so" "$(dirname "$LLVM70_PYTHON_CAPI")/libMLIRToLLVM70.so"
          sha256sum "$(dirname "$LLVM70_PYTHON_CAPI")/libMLIRToLLVM70.so"
          set +e
          (cd "$RUNNER_TEMP" && python -m pytest -q \
            --junitxml="$RUNNER_TEMP/results/baseline-pytest.xml" \
            "$RUNNER_TEMP/mlir-tests/test_llvm70_translation.py") \
            > "$RUNNER_TEMP/results/baseline-pytest.txt" 2>&1
          pytest_status=$?
          set -e
          cat "$RUNNER_TEMP/results/baseline-pytest.txt"
          test "$pytest_status" = 1
          python - <<'PY'
          import os, re, xml.etree.ElementTree as ET
          from pathlib import Path
          cases = ET.parse(Path(os.environ["RUNNER_TEMP"])/"results/baseline-pytest.xml").getroot().findall(".//testcase")
          assert len(cases) == 1
          failure = cases[0].find("failure")
          assert failure is not None
          assert cases[0].find("error") is None and cases[0].find("skipped") is None
          assert re.search(r"assert\s+0\s+==\s+3", (failure.get("message") or "") + (failure.text or ""))
          print("BASELINE_PYTEST_EXPECTED_ASSERTION=PASS")
          PY
          set +e
          lit -v "$RUNNER_TEMP/build/test" --output="$RUNNER_TEMP/results/baseline-native.json" \
            > "$RUNNER_TEMP/results/baseline-native.txt" 2>&1
          native_status=$?
          set -e
          echo "Baseline native suite exit: $native_status"
          cat "$RUNNER_TEMP/results/baseline-native.txt"
          test -s "$RUNNER_TEMP/results/baseline-native.json"
      - name: Build and validate exact candidate
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/patched-owner.cpp" cext/mlir-llvm70/lib/LLVM70Target.cpp
          git diff --exit-code
          sha256sum cext/mlir-llvm70/lib/LLVM70Target.cpp
          cmake --build "$RUNNER_TEMP/build" --target MLIRToLLVM70 llvm70-translate --parallel 2
          python validation/validation/llvm70-native-check.py \
            "$RUNNER_TEMP/build/lib/libMLIRToLLVM70.so" validation/validation/load-volatile.mlir \
            "$RUNNER_TEMP/results/patched"
          FileCheck validation/validation/load-volatile.mlir < "$RUNNER_TEMP/results/patched.ll"
          cat "$RUNNER_TEMP/results/patched.ptx"
          cp "$RUNNER_TEMP/build/lib/libMLIRToLLVM70.so" "$(dirname "$LLVM70_PYTHON_CAPI")/libMLIRToLLVM70.so"
          cmp "$RUNNER_TEMP/build/lib/libMLIRToLLVM70.so" "$(dirname "$LLVM70_PYTHON_CAPI")/libMLIRToLLVM70.so"
          sha256sum "$(dirname "$LLVM70_PYTHON_CAPI")/libMLIRToLLVM70.so"
          (cd "$RUNNER_TEMP" && python -m pytest -q \
            --junitxml="$RUNNER_TEMP/results/patched-pytest.xml" "$RUNNER_TEMP/mlir-tests") \
            | tee "$RUNNER_TEMP/results/patched-pytest.txt"
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          from pathlib import Path
          cases = ET.parse(Path(os.environ["RUNNER_TEMP"])/"results/patched-pytest.xml").getroot().findall(".//testcase")
          assert len(cases) > 1
          assert all(not list(case) for case in cases), "MLIR tests failed or skipped"
          assert any(c.get("name") == "test_llvm70_translation_preserves_volatile_loads" for c in cases)
          print("PATCHED_MLIR_CASES_PASSED=", len(cases), "; SKIPPED=0")
          PY
          set +e
          lit -v "$RUNNER_TEMP/build/test" --output="$RUNNER_TEMP/results/patched-native.json" \
            > "$RUNNER_TEMP/results/patched-native.txt" 2>&1
          native_status=$?
          set -e
          echo "Patched native suite exit: $native_status"
          cat "$RUNNER_TEMP/results/patched-native.txt"
          test -s "$RUNNER_TEMP/results/patched-native.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          results = Path(os.environ["RUNNER_TEMP"]) / "results"
          def failures(name):
              data = json.loads((results / name).read_text())
              return {t["name"]: t["code"] for t in data["tests"] if t["code"] not in ("PASS", "UNSUPPORTED")}
          baseline = failures("baseline-native.json")
          patched = failures("patched-native.json")
          assert patched == baseline, (baseline, patched)
          print("Existing native failures unchanged:", json.dumps(patched, sort_keys=True))
          print("Existing native suite compared; new real-CAPI pytest verified separately.")
          PY
      - name: Check repository conventions
        run: pre-commit run --files cext/mlir-llvm70/lib/LLVM70Target.cpp tests/mlir/test_llvm70_translation.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-load-results
          path: ${{ runner.temp }}/results
